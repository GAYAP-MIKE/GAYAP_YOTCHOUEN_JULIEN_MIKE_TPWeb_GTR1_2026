<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Contact - Mon mini-site</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
        <h1>Page de contact</h1>
        </header>
         <nav>
            <a href="index.html">Accueil</a>
            <a href="presentation.html">Présentation</a>
            <a href="contact.html">Contact</a>
        </nav>
        <h2>Formulaire de contact</h2>
        <p>Veuillez remplir ce formulaire pour envoyer un message</p>
        <form>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Entrez votre nom">
            <br>
            <br>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prénom" name="prénom" placeholder="Entrez votre prénom">
            <br>
            <br>
            <label for="email">Adresse email :</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com">
            <br>
            <br>
            <label for="telephone">Numero de telephone :</label>
            <input type="tel" id="telephone" name="telephone" placeholder="+237 XX XX XX XX">
            <br>
            <br>
            <label for="Domaine">Domaine d'interêts : </label>
            <select id="interêts" name="interêts" required>
                <option value="">Choisir son domaine d'intérêt</option>
                <option value="reseaux-informatiques">Réseaux informatiques</option>
                <option value="Cybersécurité">Cybersécurité</option>
                <option value="Développement-web">Développement web</option>
                <option value="Administration-système">Administration système</option>
            </select>
            <br>
            <br>        
            <label for="motif">Motif du message :</label>
            <br>
            <br>
            <select id="motif" name="motif" required>
                <option value="">Choisir un motif</option>
                <option value="Informations">Demande d'information</option>
                <option value="stage">Demande de stage</option>
                <option value="projet">Proposition de projet</option>
                <option value="autre">Autre demande</option>
            </select>  
            <br>
            <br>
            <p>Statut du visiteur :</p>   
            <input type="radio" id="etudiant" name="statut" value="etudiant" required>
            <label for="etudiant">Etudiant</label>
            <br>
            <input type="radio" id="enseignant" name="statut" value="enseignant" required>
            <label for="Enseignant">Enseignant</label>
            <br>
            <input type="radio" id="professionnel" name="statut" value="professionnel">
            <label for="professionnel">Professionnel</label>
            <br>
            <br>
            <label for="message">Message :</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Entrez votre message ici" required></textarea>
            <br>
            <br>         
            <input type="checkbox" id="confirmaton" name="confirmaton" required>
            <label for="confirmaton">Je confirme que les informations saisis sont correctes</label>
            <br>
            <br>
            <button type="submit">Envoyer</button>
            <button type="reset">Effacer</button>
        </form>  
        <footer>
            <p>&copy; 2026 - Mon mini-site</p>
        </footer> 
    </body>
</html>
